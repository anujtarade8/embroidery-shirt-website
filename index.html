<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thread & Stitch</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            THREAD & STITCH
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="shop.html">Shop</a>

            <a href="about.html">About</a>

            <a href="cart.html">Cart</a>

            <a href="login.html">Login</a>

        </div>

    </nav>


    <!-- HERO SECTION -->

    <section class="hero">

        <div class="hero-text">

            <h1>Wear The Art.</h1>

            <p>
                Premium embroidered shirts made for
                everyday expression.
            </p>

            <a href="shop.html" class="shop-button">
                Shop Now
            </a>

        </div>

    </section>


    <!-- FEATURED PRODUCTS -->

    <section class="featured">

        <h2>Featured Collection</h2>

        <p>
            Explore our most popular embroidered shirts.
        </p>


        <div class="products">

            <div class="product-card">

                <img src="images/shirt1.jpg">

                <h3>Floral Print</h3>

                <p>₹999</p>

                <button onclick="addToCart('Floral Print', 999, 'images/shirt1.jpg')">
                    Add to Cart
                </button>

            </div>


            <div class="product-card">

                <img src="images/shirt2.jpg">

                <h3>Mountain Scene</h3>

                <p>₹1199</p>

                <button onclick="addToCart('Mountain Scene', 1199, 'images/shirt2.jpg')">
                    Add to Cart
                </button>

            </div>


            <div class="product-card">

                <img src="images/shirt3.jpg">

                <h3>Spirit Valley</h3>

                <p>₹1299</p>

                <button onclick="addToCart('Spirit Valley', 1299, 'images/shirt3.jpg')">
                    Add to Cart
                </button>

            </div>

        </div>

    </section>
    <p id="user-status"></p>

    <script src="js/script.js"></script>

</body>

</html>
